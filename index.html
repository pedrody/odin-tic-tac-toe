<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1 id="header">Tic-Tac-Toe</h1>

    <div class="scoreboard">
        <div class="p1-score">
            <p>X</p>
            <div>
                <p><a class="player-name">Player 1</a></p>
                <p id="p1-wins">Wins: 0</p>
            </div>
        </div>
        <div class="p2-score">
            <p>O</p>
            <div>
                <p><a class="player-name">Player 2</a></p>
                <p id="p2-wins">Wins: 0</p>
            </div>
        </div>
    </div>

    <h2 id="status"></h2>
    <div id="board"></div>
    <div class="actions">
        <button id="reset">Reset</button>
    </div>
</body>

</html>
