<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1 id="header">Tic-Tac-Toe</h1>

    <div class="scoreboard">
        <div class="p1-score">
            <p>X</p>
            <div>
                <p class="player-name">Player One</p>
                <p id="p1-wins">Wins: 0</p>
            </div>
        </div>
        <div class="p2-score">
            <p>O</p>
            <div>
                <p class="player-name">Player Two</p>
                <p id="p2-wins">Wins: 0</p>
            </div>
        </div>
    </div>

    <dialog id="names-dialog">
        <form id="names-form">
            <div class="input-group">
                <label for="p1-name">Player 1:</label>
                <input id="p1-name" name="p1-name" type="text" value="Player One" required>
            </div>

            <div class="input-group">
                <label for="p2-name">Player 2:</label>
                <input id="p2-name" name="p2-name" type="text" value="Player Two" required>
            </div>

            <div class="form-actions">
                <button type="button" commandfor="names-dialog" command="close">Close</button>
                <button type="submit">Change</button>
            </div>
        </form>
    </dialog>

    <h2 id="status"></h2>
    <div id="board"></div>
    <div class="actions">
        <button id="reset">Reset</button>
        <button id="edit-names-btn">Edit names</button>
    </div>
</body>

</html>
